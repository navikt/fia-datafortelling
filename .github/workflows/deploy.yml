on:
  push:
    branches:
      - main
      - upgrade-vulnerabilities

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    name: Build and push Docker container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and push docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: pia
          tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'branch_latest' }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  render-smoke-test-branch:
    name: Smoke test before prod copy deploy
    if: github.ref == 'refs/heads/upgrade-vulnerabilities'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        cluster: [prod]
    name: Deploy naisjob to ${{ matrix.cluster }}
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@v3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ matrix.cluster }}-gcp
          RESOURCE: .nais/nais.yaml
          VARS: .nais/${{ matrix.cluster }}.yaml

  trivy-scan-prod-copy:
    permissions:
      contents: read
      id-token: write
    name: Scan prod copy image
    needs: build
    if: github.ref == 'refs/heads/upgrade-vulnerabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: pia
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        with:
          image-ref: ${{ needs.build.outputs.image }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy-prod-copy-branch:
    permissions:
      contents: read
      id-token: write
    name: Deploy fia-datafortelling-2 to prod
    needs: [build, render-smoke-test-branch, trivy-scan-prod-copy]
    if: github.ref == 'refs/heads/upgrade-vulnerabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fia-datafortelling-2-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@v3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: prod-gcp
          RESOURCE: .nais/nais-prod-copy.yaml
          VARS: .nais/prod-copy.yaml

  trivy-scan:
    name: Scanner docker image med Trivy
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read # to write sarif
      security-events: write # push sarif to GitHub security
      id-token: write # for nais/login
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: navikt/pia-actions/trivy-scan@v1.1.16 # https://github.com/navikt/pia-actions/tree/main/trivy-scan
        with:
          image: ${{ needs.build.outputs.image }}
          team: pia
