on:
  push:
    branches:
      - main
      - upgrade-vulnerabilities

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    name: Build and push Docker container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and push docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: pia
          tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'branch_latest' }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  render-smoke-test-dev:
    name: Smoke test before dev deploy
    if: github.ref == 'refs/heads/upgrade-vulnerabilities'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        cluster: [prod]
    name: Deploy naisjob to ${{ matrix.cluster }}
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@v2
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ matrix.cluster }}-gcp
          RESOURCE: .nais/nais.yaml
          VARS: .nais/${{ matrix.cluster }}.yaml

  deploy-dev-branch:
    permissions:
      contents: read
      id-token: write
    name: Deploy datafortelling to dev
    needs: [build, render-smoke-test-dev]
    if: github.ref == 'refs/heads/upgrade-vulnerabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fia-datafortelling-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@v2
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-dev.yaml
          VARS: .nais/dev.yaml

  trivy-scan:
    name: Scanner docker image med Trivy
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read # to write sarif
      security-events: write # push sarif to GitHub security
      id-token: write # for nais/login
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: navikt/pia-actions/trivy-scan@v1.1.16 # https://github.com/navikt/pia-actions/tree/main/trivy-scan
        with:
          image: ${{ needs.build.outputs.image }}
          team: pia
