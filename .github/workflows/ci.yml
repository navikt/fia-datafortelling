name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-smoke-test:
    name: Smoke test - quarto render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Installer uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Installer avhengigheter
        run: uv sync --frozen
      - name: Rendre index.qmd som røyktest
        run: uv run quarto render index.qmd
      - name: Kjør Python-tester
        run: uv run pytest
