name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  render-smoke-test:
    name: Smoke test - quarto render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Installer uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Installer avhengigheter
        run: uv sync --frozen
      - name: Rendre index.qmd som røyktest
        run: uv run quarto render index.qmd
