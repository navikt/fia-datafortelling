name: Deploy naisjob to dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy fia-datafortelling-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fia-datafortelling-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
        env:
          IMAGE: europe-north1-docker.pkg.dev/nais-management-233d/pia/fia-datafortelling@sha256:7d6ee71fabdb4b621f14ab53133eb0cc2781d986cdb35242283f35bf9a4c2673
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-dev.yaml
          VARS: .nais/dev.yaml
